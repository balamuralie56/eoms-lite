# CI for EOMS Lite.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # GitHub Actions' declarative `services:` block cannot pass command-line flags to the container, so
      # Postgres is started by hand here instead — with the SAME image, port and command as docker-compose.yml,
      # so CI and local `npm run stack:up` behave identically. Without max_connections=300, the default of 100
      # is too tight for the concurrency tests' connection pools (one test alone opens 100 of its own).
      - name: Start PostgreSQL (same command as docker-compose.yml)
        run: |
          docker run -d --name eoms-lite-test-db -p 54329:5432 \
            -e POSTGRES_PASSWORD=postgres \
            postgres:17 postgres -c max_connections=300 -c fsync=off
          for i in $(seq 1 30); do
            docker exec eoms-lite-test-db pg_isready -U postgres -h 127.0.0.1 && break
            sleep 1
          done
      - run: npm ci
      - run: npm test            # PostgreSQL tests: schema, allocation, concurrency, security, admin RPCs
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f eoms-lite-test-db

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test            # unit + component tests (mocked API)
      - run: npm run build       # production build without any secrets
      # Browser tests need the Docker stack (PostgREST) and Chrome; run them locally with `npm run stack:up` then `npm run e2e`.
