# Local PostgreSQL for DATABASE TESTS ONLY. Throwaway credentials, bound to localhost.
# Never point this at, or reuse values from, any production system.
services:
  db:
    image: postgres:17
    container_name: eoms-lite-test-db
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54329:5432"
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off"]
    tmpfs:
      - /var/lib/postgresql/data

  # PostgREST: the same Data API engine Supabase uses. LOCAL TEST STACK ONLY (profile "e2e"); throwaway secrets.
  # Authentication is stood in for by tools/local-stack/server.mjs (it is NOT Supabase Auth/GoTrue).
  postgrest:
    image: postgrest/postgrest:v12.2.3
    profiles: ["e2e"]
    container_name: eoms-lite-postgrest
    depends_on:
      - db
    environment:
      PGRST_DB_URI: postgres://authenticator:authpass@db:5432/eoms_e2e
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: e2e-only-jwt-secret-0123456789abcdef0123456789
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:3010:3000"
