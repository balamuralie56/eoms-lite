# PERSISTENT local demo stack (separate from the throwaway test stack in docker-compose.yml).
# Data lives in a named Docker volume and survives restarts and reboots; containers restart automatically with Docker.
# Bound to 127.0.0.1 only. Credentials below are LOCAL-ONLY demo values, not for any real system.
name: eoms-demo
services:
  db:
    image: postgres:17
    container_name: eoms-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: demo-local-only
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - eoms_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: eoms-demo-postgrest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authpass@db:5432/eoms_demo
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: e2e-only-jwt-secret-0123456789abcdef0123456789
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:3011:3000"

volumes:
  eoms_demo_pgdata:
